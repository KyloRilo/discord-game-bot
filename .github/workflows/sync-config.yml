name: Sync Game Configs

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  CONFIG_BUCKET: game-bot-game-config

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::115186574399:role/GithubActions-AssumeRole
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload server configs to S3
        run: |
          for config in build/*/server.json; do
            game=$(basename "$(dirname "$config")")
            echo "Uploading $config -> s3://$CONFIG_BUCKET/$game/server.json"
            aws s3 cp "$config" "s3://$CONFIG_BUCKET/$game/server.json"
          done
