name: Infra Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::115186574399:role/GithubActions-AssumeRole
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -input=false

      - name: Terraform Plan
        working-directory: terraform
        env:
          TF_VAR_github_webhook_secret: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
          TF_VAR_github_app_id: ${{ secrets.GITHUB_APP_ID }}
          TF_VAR_github_installation_id: ${{ secrets.GITHUB_INSTALLATION_ID }}
          TF_VAR_github_private_key: ${{ secrets.GITHUB_PRIVATE_KEY }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_discord_bot_token: ${{ secrets.DISCORD_BOT_TOKEN }}
          TF_VAR_discord_application_id: ${{ secrets.DISCORD_APPLICATION_ID }}
          TF_VAR_discord_public_key: ${{ secrets.DISCORD_PUBLIC_KEY }}
        run: |
          terraform plan \
            -input=false \
            -var="discord_bot_image_tag=${{ github.sha }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply \
            -input=false \
            -var="discord_bot_image_tag=${{ github.sha }}" \
            -auto-approve \
            tfplan
  
  push-secrets:
    name: Push Secrets 
    runs-on: ubuntu-latest
    needs:
      - terraform

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::115186574399:role/GithubActions-AssumeRole
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update Discord secret
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
        run: |
          aws secretsmanager put-secret-value \
            --secret-id "game-bot/discord" \
            --secret-string "$(jq -n \
              --arg bot_token "$DISCORD_BOT_TOKEN" \
              --arg application_id "$DISCORD_APPLICATION_ID" \
              --arg public_key "$DISCORD_PUBLIC_KEY" \
              '{
                bot_token: $bot_token,
                application_id: $application_id,
                public_key: $public_key
              }')"

  register-commands:
    name: Register Discord Commands
    runs-on: ubuntu-latest
    needs:
      - push-secrets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Register commands
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
        run: python register_commands.py